name: 發布並驗證 GitHub Pages

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['docs/**', '.github/workflows/pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Fetch the current main after the synchronization commit has been pushed.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: 檢查網站與這次發布資料一致
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: python scripts/verify_pages.py
