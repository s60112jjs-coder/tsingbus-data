name: 校外交通靜態班表同步

on:
  schedule:
    # UTC -> Taiwan 05:30 / 17:30. GitHub may delay scheduled runs.
    - cron: '30 21,9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: transit-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 驗證資料轉換規則
        run: python -m unittest discover -s tests -v
      - name: 查詢並驗證官方靜態資料
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: python scripts/sync_transit.py --origin-frequency-ready
      - name: 只提交實質異動
        run: |
          git add docs/v1/transit.json docs/v1/manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "tsingbus-bot"
          git config user.email "bot@users.noreply.github.com"
          git commit -m "data: sync official transit timetables"
          # Do not force push or overwrite concurrent changes. A conflict fails safely.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  publish:
    needs: sync
    uses: ./.github/workflows/pages.yml
